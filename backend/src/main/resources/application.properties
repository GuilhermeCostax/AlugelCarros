spring.application.name=aluguel-carros

# Lê as credenciais do arquivo backend/.env (não versionado)
spring.config.import=optional:file:.env[.properties]

# Banco de dados - Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA: o schema é criado pelas migrações do Flyway; o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (migrações em src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - endereço do frontend (Vite)
app.cors.allowed-origins=http://localhost:5173

server.port=8080
